name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  docker:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe tudo e testa online -> offline
        run: |
          docker compose up -d --build
          sleep 6
          curl -sf localhost:3000/api/status | grep '"status":"online"'
          docker compose stop core
          sleep 3
          curl -sf localhost:3000/api/status | grep '"status":"offline"'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - run: docker compose down
